xarm6:
  # IKFast is analytical (exact, instant) but fails for horizontal shelf
  # orientations (AIM_STRAIGHT_FRONT_QUAT) at extended reach — no exact
  # solution exists.  KDL is numerical (approximate, needs more time) and
  # finds valid solutions by relaxing orientation slightly (~2°).
  # kinematics_solver: xarm6_ikfast_plugin/IKFastKinematicsPlugin
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
